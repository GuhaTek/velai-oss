# VelAI Helm chart — Phase 1: Admin Console + Orchestrator + On-call agent.
#
# This chart contains NO secrets and NO proprietary code — only Kubernetes
# manifests. You supply:
#   * container images (from the registry VelAI grants you pull access to), and
#   * two pre-created Secrets (see below): the licence bundle and, optionally,
#     the admin-console SSO client secret.
# See README.md for the full install flow.

nameOverride: ""
fullnameOverride: ""

# ── Container images ─────────────────────────────────────────────────────────
# The images come from the VelAI registry (private: provide a pull secret in
# imagePullSecrets). The image tags below are placeholders — override with the
# version you were given.
image:
  # The VelAI registry host. Combined with the repo names below to form
  # <registry>/velai-shared/<component>:<tag>. Change it only if you mirror the images.
  registry: "registry.guhatek.com"
  pullPolicy: IfNotPresent
# Name a pre-created docker-registry Secret used to pull the images, e.g.:
#   kubectl -n velai create secret docker-registry velai-pull \
#     --docker-server=<registry> --docker-username=<user> --docker-password=<token>
imagePullSecrets: []
# - name: velai-pull

adminConsole:
  enabled: true
  image: "velai-shared/admin-console:latest"
  replicas: 1
  port: 8080
  # SSO (generic OIDC — Google, JumpCloud, Okta…). Non-secret config here; the
  # OIDC *client secret* comes from the Secret named in `existingSecret` below
  # (key OIDC_CLIENT_SECRET). Leave issuer empty to run with the local admin
  # login only (username/password from the licence bundle).
  oidc:
    issuer: ""            # e.g. https://accounts.google.com
    clientId: ""
    adminGroup: ""        # optional group required to sign in at all (a gate, not a role)
    # Group -> console role from the `groups` claim: "grp=admin,grp=operator,grp=member".
    # Highest mapped role wins; a Users-page assignment overrides it. The console refuses to
    # start on an unknown role.
    roleGroups: ""
  allowedDomain: ""       # restrict SSO sign-in to this email domain (optional)
  adminEmails: ""         # comma-separated emails granted the admin role
  sessionIdleMinutes: 30
  # Pre-created Secret with the admin-console runtime secrets:
  #   ADMIN_USERNAME, ADMIN_PASSWORD_HASH (from your VelAI credential bundle),
  #   SESSION_SECRET (a random 32+ char string), and, if using SSO,
  #   OIDC_CLIENT_SECRET. See README.
  existingSecret: "velai-admin-secrets"
  ingress:
    enabled: false
    className: ""
    host: ""              # e.g. velai.your-company.com
    annotations: {}
    tls: []               # [{secretName: velai-tls, hosts: [velai.your-company.com]}]
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

orchestrator:
  enabled: true
  image: "velai-shared/orchestrator:latest"
  replicas: ~             # unset: starts at 1, then the Admin Console switches it on/off. A number pins it from Helm.
  port: 8080
  # Protected image (e.g. velai-shared/orchestrator:<version>): the agent's compiled modules are
  # sealed and unsealed at start into a RAM-backed tmpfs, so they never touch disk. The image
  # fetches its key from the VelAI licence server at start (licence-gated, bound to your
  # cluster). Images built for one tenant (velai-tenant/<slug>/...) instead need VELAI_SEAL_KEY.
  protected:
    enabled: false
    tmpfsSize: "256Mi"
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "1",    memory: "1Gi" }

oncall:
  enabled: true
  image: "velai-shared/oncall:latest"
  replicas: ~             # unset: starts at 1, then the Admin Console switches it on/off. A number pins it from Helm.
  port: 8080
  # Settings scope this agent's config is synced from (<externalSecrets.prefix>/<scope>). Blank =
  # "oncall". The Admin Console sets it for a named instance, e.g. "agent-instances/oncall/<name>".
  settingsScope: ""
  # Protected image (e.g. velai-shared/oncall:<version>): the agent's compiled modules are
  # sealed and unsealed at start into a RAM-backed tmpfs, so they never touch disk. The image
  # fetches its key from the VelAI licence server at start (licence-gated, bound to your
  # cluster). Images built for one tenant (velai-tenant/<slug>/...) instead need VELAI_SEAL_KEY.
  protected:
    enabled: false
    tmpfsSize: "256Mi"
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "1",    memory: "1Gi" }

# ── Licensed agents (optional, all off by default) ───────────────────────────
# Conversation, RCA and Remediation are paid add-ons: enable one only when your licence includes
# it, point its image at your VelAI version (velai-shared/<agent>:<version>) and add it to
# externalSecrets.agents so it receives its config. The published images are protected builds
# (protected.enabled=true). Each takes `settingsScope` like oncall above; the Admin Console's
# instance / tenant pages print the exact values for a named deployment.
conversation:
  enabled: false
  image: "velai-shared/conversation:latest"
  replicas: 1
  port: 8080
  settingsScope: ""
  protected:
    enabled: true
    tmpfsSize: "256Mi"
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# RCA agent: root-cause analysis over alerts, using the MCP servers below as its tools. Uses the
# chart Redis (DB 1) and Qdrant (vector memory, below). Its alert webhook requires RCA_API_KEY,
# generated into the Secret <fullname>-agent-keys (read it to configure your alert source); the
# orchestrator and on-call agent in the same release are given the same key automatically.
rca:
  enabled: false
  image: "velai-shared/rca-agent:latest"
  port: 8080
  settingsScope: ""
  protected:
    enabled: true
    tmpfsSize: "256Mi"
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits:   { cpu: "1",    memory: "2Gi" }

# Remediation agent: turns a completed RCA into a recovery plan, posted to Slack for approval, and
# executes approved Kubernetes actions. Deployed with the embedding service below and shares the
# RCA agent's Qdrant + Redis, so enable it on the release that runs `rca`.
remediation:
  enabled: false
  image: "velai-shared/remediation:latest"
  port: 8080
  settingsScope: ""
  # Namespaces it may act in (rollout restart / scale / rollback / delete pod / patch limits or
  # HPA). One Role + RoleBinding per namespace. EMPTY = it can plan but every action is refused.
  allowedNamespaces: []
  # Nightly knowledge-base sync (Confluence + resolved Jira) into Qdrant.
  ingestion:
    schedule: "0 2 * * *"
    suspend: false
  protected:
    enabled: true
    tmpfsSize: "256Mi"
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# Embedding service the remediation agent uses (deployed whenever remediation is enabled).
embedding:
  image: "velai-shared/embedding:latest"
  port: 8080
  resources:
    requests: { cpu: "500m", memory: "2.5Gi" }
    limits:   { cpu: "1",    memory: "4Gi" }

# Vector store for RCA memory + the remediation knowledge base (deployed whenever rca or
# remediation is enabled). Requires an API key on every request, generated into
# <fullname>-agent-keys.
qdrant:
  image: "qdrant/qdrant:v1.9.2"
  port: 6333
  persistence:
    enabled: true
    size: "10Gi"
    storageClass: ""
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "1",    memory: "2Gi" }

# ── Built-in MCP servers (optional, all off by default) ──────────────────────
# Tool servers the RCA / conversation agents call (Kubernetes, Prometheus, New Relic,
# OpenSearch, GitLab). Enable one with e.g. `--set mcp.prometheus.enabled=true` and point
# its image at your VelAI version (velai-shared/mcp-prometheus:<version>). Services are
# named <fullname>-mcp-<name>:8000, which is where the Admin Console tells agents to find
# them — keep fullnameOverride unset (or "velai") when using MCP servers.
#
# kubernetes is the only server that reads the Kubernetes API: enabling it creates a
# ClusterRole + ClusterRoleBinding (read-only pods/events/logs/workloads, cluster-wide), so
# that upgrade must be run by someone with cluster-admin rights. It authenticates with its
# own ServiceAccount; no kubeconfig is needed for the cluster it runs in.
mcp:
  port: 8000
  # Settings scope the servers' credentials are read from (<externalSecrets.prefix>/<scope>):
  # the scope the Admin Console compiles the RCA agent's MCP connections into. "rca" for the
  # core RCA agent, or e.g. "agent-instances/rca/<instance>" for a named instance. Needs
  # externalSecrets.enabled; each server receives only its own keys from that scope.
  settingsScope: "rca"
  # The published MCP images are protected (sealed) builds, unsealed at start like the agents.
  protected:
    enabled: true
    tmpfsSize: "256Mi"
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits:   { cpu: "250m", memory: "512Mi" }
  kubernetes:
    enabled: false
    image: "velai-shared/mcp-kubernetes:latest"
  prometheus:
    enabled: false
    image: "velai-shared/mcp-prometheus:latest"
  newrelic:
    enabled: false
    image: "velai-shared/mcp-newrelic:latest"
  opensearch:
    enabled: false
    image: "velai-shared/mcp-opensearch:latest"
  gitlab:
    enabled: false
    image: "velai-shared/mcp-gitlab:latest"

# Token the Console, Orchestrator and On-call agent present to each other's internal
# endpoints (they refuse calls without it). Generated into a chart-managed Secret on first
# install and kept across upgrades; set existingSecret to supply your own (key
# INTERNAL_API_TOKEN). The same Secret carries MCP_AUTH_TOKEN, which the MCP servers require
# from callers (without it they answer only /health); give your RCA agent the same value.
internalToken:
  existingSecret: ""

# ── Licence ──────────────────────────────────────────────────────────────────
# The agents authenticate to the VelAI licence server on startup + daily. Create
# the Secret below from the credential bundle you were issued (it holds
# VELAI_TENANT_SLUG, VELAI_LICENSE_URL, the tenant key + CA cert, and VELAI_SEAL_KEY for
# protected images), e.g.:
#   kubectl -n velai create secret generic velai-license \
#     --from-literal=VELAI_TENANT_SLUG=<slug> \
#     --from-literal=VELAI_LICENSE_URL=<url> \
#     --from-file=VELAI_LICENSE_KEY=./<slug>-tenant.key \
#     --from-file=VELAI_LICENSE_CA=./<slug>-velai-ca.crt \
#     --from-literal=VELAI_SEAL_KEY='<seal key from your bundle>'
license:
  existingSecret: "velai-license"
  # The cluster UID the licence is bound to (Guard 1). If empty, the agent reads
  # it in-cluster automatically. Set it explicitly if the agent lacks RBAC to
  # read the kube-system namespace:
  #   kubectl get namespace kube-system -o jsonpath='{.metadata.uid}'
  clusterUid: ""

# Optional pre-created Secret with the agents' own runtime config (your LLM
# provider keys, Slack/Jira tokens, etc.). Managed from the Admin Console UI in
# normal operation; envFrom here as an optional bootstrap.
agentConfig:
  existingSecret: ""

# ── Secret backend (agent configuration storage) ─────────────────────────────
# Where the Admin Console stores each agent's configuration — LLM keys, Slack/Jira
# tokens, MCP creds, etc. External Secrets Operator (below) syncs it into the
# agents' pods. Choose one: aws | azure | gcp | oci | vault.
#
# Blank = UNCONFIGURED: the console still starts, but agent configuration can't be
# saved until you pick a backend (do it in Admin Configuration → Secret backend,
# which prints the exact Helm values to apply here on the next upgrade).
secretBackend: ""

aws:
  region: ""                              # e.g. ap-south-1 (blank => pod/instance region)
vault:                                    # secretBackend=vault (self-hosted HashiCorp Vault, KV v2)
  addr: ""                                # https://vault.vault.svc:8200
  mount: "secret"
  k8sRole: "velai-admin"                  # Vault Kubernetes-auth role bound to the agents' SA
  k8sAuthPath: "kubernetes"               # Vault kubernetes auth mount
azure:                                    # secretBackend=azure (Azure Key Vault)
  vaultUrl: ""                            # https://myvault.vault.azure.net
  serviceAccount: "velai-admin-console"   # SA bound to the Azure workload identity
gcp:                                      # secretBackend=gcp (Google Cloud Secret Manager)
  project: ""
  clusterLocation: ""                     # region/zone, for ESO workload-identity auth
  clusterName: ""
  serviceAccount: "velai-admin-console"
oci:                                      # secretBackend=oci (OCI Vault — Secrets service)
  auth: "workload"                        # workload (OKE Workload Identity) | instance | config
  region: ""                              # e.g. ap-mumbai-1
  vault: ""                               # ocid1.vault…
  compartment: ""                         # ocid1.compartment…
  key: ""                                 # ocid1.key…  (KMS key that encrypts new secrets)
  serviceAccount: "velai-admin-console"

# External Secrets Operator wiring — the chart creates the SecretStore(s) for your
# chosen backend and a per-agent ExternalSecret that syncs <prefix>/<agent>/* into
# the agents' Secrets. Enable once secretBackend is set.
externalSecrets:
  enabled: false
  prefix: "velai"                         # store prefix — matches the console's settings_prefix
  # Agents that get a synced config Secret. Keep to the agents this release actually
  # deploys (free tier = orchestrator + oncall). OneGT renders this list from the
  # tenant's licence — add a paid agent (conversation/rca) only when it's licensed
  # AND deployed. Creating ExternalSecrets for undeployed agents just adds noise.
  agents: [orchestrator, oncall]
  refreshInterval: "1h"
  # AWS uses two pre-created ClusterSecretStores (you create them with the IRSA/role
  # that can read SSM + Secrets Manager). azure/gcp/oci/vault stores are chart-created.
  paramsStore: "aws-parameter-store"
  secretsStore: "aws-secrets-manager"
  # azure/gcp/oci/vault: create the cluster-wide ClusterSecretStore (velai-<backend>). Set false on
  # a second release in the same cluster (an agent instance) so it uses the one the first created.
  createStores: true

# Bundled External Secrets Operator (subchart). Set false if your cluster already
# runs ESO — the chart's SecretStore/ExternalSecret templates still apply.
eso:
  enabled: true
external-secrets:
  installCRDs: true

# ── In-cluster Redis (orchestrator queue + console history) ──────────────────
redis:
  enabled: true
  image: "redis:7-alpine"
  port: 6379
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits:   { cpu: "250m", memory: "256Mi" }

# ── In-cluster PostgreSQL (durable chat/incident history) ────────────────────
# Provides DATABASE_URL to the console + agents. The password is auto-generated
# into a chart-managed Secret on first install and preserved across upgrades — no
# password is stored in this file. To use your own managed Postgres instead, set
# postgresql.enabled=false and postgresql.externalUrl=postgres://user:pass@host/db.
postgresql:
  enabled: true
  image: "postgres:16-alpine"
  port: 5432
  database: "velai"
  username: "velai"
  # Leave blank to auto-generate; or name a pre-created Secret with key "password".
  existingSecret: ""
  externalUrl: ""     # use an external DB instead of the in-cluster one
  persistence:
    enabled: true
    size: "5Gi"
    storageClass: ""
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "1",    memory: "1Gi" }

# ── Image-pull secret auto-refresh (license-gated) ──────────────────────────
# When enabled, the Admin Console fetches short-lived registry credentials from
# the VelAI licence server (returned only while your licence is valid) and keeps
# the pull secret named below refreshed — so the kubelet can pull the private
# images without you managing a long-lived token. Reference the same secret name
# in imagePullSecrets above. Leave disabled to manage velai-pull yourself, or if
# you use cross-account ECR / IRSA (serviceAccount.annotations) instead.
pullRefresh:
  enabled: false
  secretName: "velai-pull"
  intervalHours: 6
  # For a release WITHOUT its own Admin Console (an agent instance in its own namespace): the
  # namespace of the Admin Console that keeps this release's pull secret refreshed. Grants that
  # console's ServiceAccount (same name as this release's) create + get/patch on secretName here.
  # Set together with enabled=true.
  consoleNamespace: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}   # e.g. eks.amazonaws.com/role-arn for IRSA-based image pull

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
