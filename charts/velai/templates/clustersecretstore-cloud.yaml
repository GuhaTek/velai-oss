{{- /*
Cloud ClusterSecretStores for External Secrets Operator — created for secretBackend azure / gcp /
oci. The Admin Console writes each agent's config into the provider (flattening
"<prefix>/<agent>/<KEY>" to a flat secret name with '-'); ESO reads it back into the agents' k8s
Secrets. Auth is Workload Identity / resource principal — the referenced ServiceAccount must be
bound to the cloud identity that can read the vault. NOTE: provider-specific; validate against your
cloud + ESO version.
*/}}
{{- if and .Values.externalSecrets.enabled (ne .Values.externalSecrets.createStores false) (eq .Values.secretBackend "azure") }}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: velai-azure
  labels:
    {{- include "velai.labels" . | nindent 4 }}
spec:
  provider:
    azurekv:
      vaultUrl: {{ .Values.azure.vaultUrl | quote }}
      authType: WorkloadIdentity
      serviceAccountRef:
        name: {{ .Values.azure.serviceAccount | quote }}
        namespace: {{ .Release.Namespace }}
{{- end }}
{{- if and .Values.externalSecrets.enabled (ne .Values.externalSecrets.createStores false) (eq .Values.secretBackend "gcp") }}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: velai-gcp
  labels:
    {{- include "velai.labels" . | nindent 4 }}
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.gcp.project | quote }}
      auth:
        workloadIdentity:
          clusterLocation: {{ .Values.gcp.clusterLocation | quote }}
          clusterName: {{ .Values.gcp.clusterName | quote }}
          serviceAccountRef:
            name: {{ .Values.gcp.serviceAccount | quote }}
            namespace: {{ .Release.Namespace }}
{{- end }}
{{- if and .Values.externalSecrets.enabled (ne .Values.externalSecrets.createStores false) (eq .Values.secretBackend "oci") }}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: velai-oci
  labels:
    {{- include "velai.labels" . | nindent 4 }}
spec:
  provider:
    oracle:
      region: {{ .Values.oci.region | quote }}
      vault: {{ .Values.oci.vault | quote }}
      {{- if eq .Values.oci.auth "instance" }}
      principalType: InstancePrincipal
      {{- else if eq .Values.oci.auth "workload" }}
      principalType: Workload
      serviceAccountRef:
        name: {{ .Values.oci.serviceAccount | quote }}
        namespace: {{ .Release.Namespace }}
      {{- end }}
{{- end }}
