{{- if .Values.adminConsole.enabled }}
{{- $fn := include "velai.fullname" . }}
{{- $targets := list }}
{{- if .Values.orchestrator.enabled }}{{- $targets = append $targets (dict "key" "orchestrator" "label" "Orchestrator" "url" (printf "http://%s-orchestrator:%v/healthz" $fn .Values.orchestrator.port)) }}{{- end }}
{{- if .Values.oncall.enabled }}{{- $targets = append $targets (dict "key" "oncall" "label" "On-Call" "url" (printf "http://%s-oncall:%v/healthz" $fn .Values.oncall.port)) }}{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-admin-console
  labels: {{- include "velai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.adminConsole.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: admin-console
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: admin-console
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "velai.serviceAccountName" . }}
      {{- include "velai.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: admin-console
          image: {{ include "velai.image" (dict "registry" .Values.image.registry "image" .Values.adminConsole.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.adminConsole.port }}
          env:
            {{- include "velai.licenseEnv" . | nindent 12 }}
            {{- include "velai.versionEnv" .Values.adminConsole.image | nindent 12 }}
            {{- include "velai.internalTokenEnv" . | nindent 12 }}
            {{- include "velai.secretBackendEnv" . | nindent 12 }}
            - name: AUTH_DISABLED
              value: "false"
            - name: OIDC_ISSUER
              value: {{ .Values.adminConsole.oidc.issuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ .Values.adminConsole.oidc.clientId | quote }}
            - name: OIDC_ADMIN_GROUP
              value: {{ .Values.adminConsole.oidc.adminGroup | quote }}
            - name: OIDC_ROLE_GROUPS
              value: {{ .Values.adminConsole.oidc.roleGroups | default "" | quote }}
            - name: GOOGLE_ALLOWED_DOMAIN
              value: {{ .Values.adminConsole.allowedDomain | quote }}
            - name: ADMIN_EMAILS
              value: {{ .Values.adminConsole.adminEmails | quote }}
            - name: SESSION_IDLE_MINUTES
              value: {{ .Values.adminConsole.sessionIdleMinutes | quote }}
            - name: SERVICE_PREFIX
              value: {{ $fn | quote }}
            - name: ORCHESTRATOR_BASE_URL
              value: "http://{{ $fn }}-orchestrator:{{ .Values.orchestrator.port }}"
            - name: ONCALL_BASE_URL
              value: "http://{{ $fn }}-oncall:{{ .Values.oncall.port }}"
            - name: REDIS_URL
              value: {{ include "velai.redisUrl" . | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HEALTH_TARGETS
              value: {{ toJson $targets | quote }}
            # Built-in MCP servers ship with the RCA agent, which this chart does not deploy. An
            # explicit "[]" stops the console (>= 0.1.540) deriving default targets from
            # SERVICE_PREFIX and listing five "not deployed" servers on the dashboard's MCP health panel.
            - name: MCP_HEALTH_TARGETS
              value: "[]"
            {{- if .Values.pullRefresh.enabled }}
            - name: VELAI_PULL_REFRESH_ENABLED
              value: "true"
            - name: VELAI_PULL_SECRET_NAME
              value: {{ .Values.pullRefresh.secretName | quote }}
            - name: VELAI_PULL_REFRESH_HOURS
              value: {{ .Values.pullRefresh.intervalHours | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.license.existingSecret | quote }}
                optional: true
            - secretRef:
                name: {{ .Values.adminConsole.existingSecret | quote }}
                optional: true
            {{- include "velai.dbEnvFrom" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /healthz, port: {{ .Values.adminConsole.port }} }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: {{ .Values.adminConsole.port }} }
            initialDelaySeconds: 15
          resources: {{- toYaml .Values.adminConsole.resources | nindent 12 }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-admin-console
  labels: {{- include "velai.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: admin-console
  ports:
    - port: {{ .Values.adminConsole.port }}
      targetPort: {{ .Values.adminConsole.port }}
{{- end }}
