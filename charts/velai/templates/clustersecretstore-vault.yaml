{{- /*
Vault ClusterSecretStore for ESO — created for secretBackend=vault. The Admin Console writes config
into Vault KV v2 and ESO reads it back into the agents' k8s Secrets. ESO authenticates to Vault with
its own ServiceAccount via Vault's Kubernetes auth backend — the Vault role (vault.k8sRole) must
permit that SA. NOTE: validate against your Vault + ESO version; auth wiring is environment-specific.
*/}}
{{- if and .Values.externalSecrets.enabled (ne .Values.externalSecrets.createStores false) (eq .Values.secretBackend "vault") }}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: velai-vault
  labels:
    {{- include "velai.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.vault.addr | quote }}
      path: {{ .Values.vault.mount | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: {{ .Values.vault.k8sAuthPath | quote }}
          role: {{ .Values.vault.k8sRole | quote }}
{{- end }}
