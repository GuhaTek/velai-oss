{{- /*
Per-agent ExternalSecrets — ESO syncs the Admin Console's stored config for each agent
(<prefix>/<agent>/*, or <prefix>/<agent.settingsScope>/* when set) from the chosen backend into a k8s Secret the agent envFroms
({fullname}-{agent}-secrets, plus -params for AWS SSM). The console writes the values; ESO reads
them back. AWS is the production-tested path; azure/gcp/oci/vault are provider-specific — validate
against your cloud + ESO version.
When any MCP server is enabled, the scope `mcp.settingsScope` is synced the same way into
{fullname}-mcp-secrets (+ -params on AWS); the MCP pods pick only their own keys out of it.
*/}}
{{- if .Values.externalSecrets.enabled }}
{{- $full := include "velai.fullname" . -}}
{{- $es := .Values.externalSecrets -}}
{{- $ns := .Release.Namespace -}}
{{- $backend := .Values.secretBackend -}}
{{- $scopes := list -}}
{{- range $a := $es.agents }}
{{- $scope := $a -}}
{{- if kindIs "map" (index $.Values $a) }}{{- with (index $.Values $a).settingsScope }}{{- $scope = . | trimAll "/" -}}{{- end }}{{- end }}
{{- $scopes = append $scopes (dict "name" $a "base" (printf "%s/%s" $es.prefix $scope)) -}}
{{- end }}
{{- if include "velai.mcpEnabled" . }}{{- $scopes = append $scopes (dict "name" "mcp" "base" (printf "%s/%s" $es.prefix (.Values.mcp.settingsScope | trimAll "/"))) -}}{{- end }}
{{- range $s := $scopes }}
{{- $agent := $s.name -}}
{{- $base := $s.base -}}
{{- if eq $backend "vault" }}
# {{ $agent }} — Vault KV entry {{ $base }} (one field per key) -> Secret {{ $full }}-{{ $agent }}-secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $full }}-{{ $agent }}-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "velai.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: velai-vault
  target:
    name: {{ $full }}-{{ $agent }}-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ $base | quote }}
---
{{- else if or (eq $backend "azure") (eq $backend "gcp") (eq $backend "oci") }}
{{- $store := "velai-oci" -}}
{{- if eq $backend "azure" }}{{- $store = "velai-azure" -}}{{- else if eq $backend "gcp" }}{{- $store = "velai-gcp" -}}{{- end }}
{{- $flat := $base | replace "/" "-" -}}
# {{ $agent }} — {{ $backend }} secrets named {{ $flat }}-* -> Secret {{ $full }}-{{ $agent }}-secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $full }}-{{ $agent }}-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "velai.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    name: {{ $full }}-{{ $agent }}-secrets
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "^{{ $flat }}-"
      rewrite:
        - regexp:
            source: "{{ $flat }}-(.*)"
            target: "$1"
---
{{- else }}
# {{ $agent }} — SSM params under {{ $base }}/* -> Secret {{ $full }}-{{ $agent }}-params
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $full }}-{{ $agent }}-params
  namespace: {{ $ns }}
  labels:
    {{- include "velai.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.paramsStore }}
  target:
    name: {{ $full }}-{{ $agent }}-params
    creationPolicy: Owner
  dataFrom:
    - find:
        path: "/{{ $base }}/"
        name:
          regexp: ".*"
      rewrite:
        - regexp:
            source: "/{{ $base }}/(.*)"
            target: "$1"
---
# {{ $agent }} — Secrets Manager JSON secret {{ $base }} (one field per key) -> Secret {{ $full }}-{{ $agent }}-secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $full }}-{{ $agent }}-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "velai.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $es.secretsStore }}
  target:
    name: {{ $full }}-{{ $agent }}-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ $base | quote }}
---
{{- end }}
{{- end }}
{{- end }}
