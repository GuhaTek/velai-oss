{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "velai.serviceAccountName" . }}
  labels: {{- include "velai.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
# The Admin Console reads agent Deployments to show health (RAG status) and reads
# the kube-system namespace UID for the licence cluster binding (Guard 1). This
# Role grants only those read verbs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "velai.fullname" . }}-console
  labels: {{- include "velai.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  {{- $fn := include "velai.fullname" . }}
  {{- $agents := list }}
  {{- if .Values.orchestrator.enabled }}{{ $agents = append $agents "orchestrator" }}{{ end }}
  {{- if .Values.oncall.enabled }}{{ $agents = append $agents "oncall" }}{{ end }}
  {{- if (.Values.conversation | default dict).enabled }}{{ $agents = append $agents "conversation" }}{{ end }}
  {{- if (.Values.rca | default dict).enabled }}{{ $agents = append $agents "rca-agent" }}{{ end }}
  {{- range $m := splitList "," (include "velai.mcpEnabled" .) }}{{ if $m }}{{ $agents = append $agents (printf "mcp-%s" $m) }}{{ end }}{{ end }}
  {{- if $agents }}
  # Save & Apply (restart to pick up re-synced config) and on/off (scale 0/1) — patch on this
  # release's agent Deployments only.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ range $i, $a := $agents }}{{ if $i }}, {{ end }}{{ printf "%s-%s" $fn $a | quote }}{{ end }}]
    verbs: ["patch"]
  {{- if .Values.externalSecrets.enabled }}
  # Save & Apply: force-sync the agents' ExternalSecrets (the console's saved config).
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    resourceNames: [{{ range $i, $a := .Values.externalSecrets.agents }}{{ if $i }}, {{ end }}{{ printf "%s-%s-params" $fn $a | quote }}, {{ printf "%s-%s-secrets" $fn $a | quote }}{{ end }}]
    verbs: ["get", "patch"]
  {{- end }}
  {{- end }}
  {{- if .Values.pullRefresh.enabled }}
  # Image-pull secret refresh: create it, then get/patch only that one secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.pullRefresh.secretName | quote }}]
    verbs: ["get", "update", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "velai.fullname" . }}-console
  labels: {{- include "velai.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "velai.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "velai.fullname" . }}-console
  apiGroup: rbac.authorization.k8s.io
{{- if and .Values.pullRefresh.enabled .Values.pullRefresh.consoleNamespace }}
---
# The Admin Console in namespace {{ .Values.pullRefresh.consoleNamespace }} keeps this release's
# image-pull secret refreshed (this release has no console of its own): that secret only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "velai.fullname" . }}-console-pull
  labels: {{- include "velai.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.pullRefresh.secretName | quote }}]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "velai.fullname" . }}-console-pull
  labels: {{- include "velai.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "velai.serviceAccountName" . }}
    namespace: {{ .Values.pullRefresh.consoleNamespace }}
roleRef:
  kind: Role
  name: {{ include "velai.fullname" . }}-console-pull
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
# kube-system namespace UID read (Guard 1) — a namespaced read isn't enough, so a
# tightly-scoped ClusterRole limited to GET on namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "velai.fullname" . }}-{{ .Release.Namespace }}-ns-read
  labels: {{- include "velai.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "velai.fullname" . }}-{{ .Release.Namespace }}-ns-read
  labels: {{- include "velai.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "velai.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "velai.fullname" . }}-{{ .Release.Namespace }}-ns-read
  apiGroup: rbac.authorization.k8s.io
