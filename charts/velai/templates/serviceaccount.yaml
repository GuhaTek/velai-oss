{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "velai.serviceAccountName" . }}
  labels: {{- include "velai.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
# The Admin Console reads agent Deployments to show health (RAG status) and reads
# the kube-system namespace UID for the licence cluster binding (Guard 1). This
# Role grants only those read verbs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "velai.fullname" . }}-console
  labels: {{- include "velai.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  {{- with (include "velai.consoleApplyRules" (dict "root" . "deployVerbs" (list "patch")) | trim) }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- if .Values.pullRefresh.enabled }}
  # Image-pull secret refresh: create it, then get/patch only that one secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.pullRefresh.secretName | quote }}]
    verbs: ["get", "update", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "velai.fullname" . }}-console
  labels: {{- include "velai.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "velai.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "velai.fullname" . }}-console
  apiGroup: rbac.authorization.k8s.io
{{- if and .Values.pullRefresh.enabled .Values.pullRefresh.consoleNamespace }}
---
# The Admin Console in namespace {{ .Values.pullRefresh.consoleNamespace }} keeps this release's
# image-pull secret refreshed (this release has no console of its own): that secret only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "velai.fullname" . }}-console-pull
  labels: {{- include "velai.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.pullRefresh.secretName | quote }}]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "velai.fullname" . }}-console-pull
  labels: {{- include "velai.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    # The console's ServiceAccount: consoleAccess.serviceAccount when set (a console from another
    # chart need not share this release's name), else this release's own name, as before.
    name: {{ (.Values.consoleAccess | default dict).serviceAccount | default (include "velai.serviceAccountName" .) }}
    namespace: {{ .Values.pullRefresh.consoleNamespace }}
roleRef:
  kind: Role
  name: {{ include "velai.fullname" . }}-console-pull
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- $access := (.Values.consoleAccess | default dict) }}
{{- if $access.namespace }}
{{- $rules := include "velai.consoleApplyRules" (dict "root" . "deployVerbs" (list "get" "patch")) | trim }}
{{- if $rules }}
---
# The Admin Console in namespace {{ $access.namespace }} applies this release (an agent instance
# without a console of its own) from its instance page: it force-syncs this release's
# ExternalSecrets and restarts and reads the rollout of its Deployments — the same objects the
# console's own Role names, nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "velai.fullname" . }}-console-apply
  labels: {{- include "velai.labels" . | nindent 4 }}
rules:
  {{- $rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "velai.fullname" . }}-console-apply
  labels: {{- include "velai.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $access.serviceAccount | default (include "velai.serviceAccountName" .) }}
    namespace: {{ $access.namespace }}
roleRef:
  kind: Role
  name: {{ include "velai.fullname" . }}-console-apply
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
---
# kube-system namespace UID read (Guard 1) — a namespaced read isn't enough, so a
# tightly-scoped ClusterRole limited to GET on namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "velai.fullname" . }}-{{ .Release.Namespace }}-ns-read
  labels: {{- include "velai.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "velai.fullname" . }}-{{ .Release.Namespace }}-ns-read
  labels: {{- include "velai.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "velai.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "velai.fullname" . }}-{{ .Release.Namespace }}-ns-read
  apiGroup: rbac.authorization.k8s.io
