{{- if (.Values.rca | default dict).enabled }}
{{- $fn := include "velai.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-rca-agent
  labels: {{- include "velai.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: rca-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: rca-agent
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # RCA reaches Kubernetes only through the kubernetes MCP server; it has no API client.
      automountServiceAccountToken: false
      {{- include "velai.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000        # the image runs as appuser (uid 1000)
        runAsGroup: 1000
      containers:
        - name: agent
          image: {{ include "velai.image" (dict "registry" .Values.image.registry "image" .Values.rca.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.rca.port }}
          env:
            {{- include "velai.licenseEnv" . | nindent 12 }}
            {{- include "velai.versionEnv" .Values.rca.image | nindent 12 }}
            {{- include "velai.internalTokenEnv" . | nindent 12 }}
            {{- include "velai.mcpTokenEnv" . | nindent 12 }}
            {{- include "velai.protectEnv" (dict "p" .Values.rca.protected) | nindent 12 }}
            {{- include "velai.agentKeyEnv" (dict "root" . "key" "RCA_API_KEY") | nindent 12 }}
            {{- include "velai.agentKeyEnv" (dict "root" . "key" "QDRANT_API_KEY") | nindent 12 }}
            - name: REDIS_URL
              value: {{ include "velai.agentRedisUrl" . | quote }}
            - name: QDRANT_URL
              value: "http://{{ $fn }}-qdrant:{{ .Values.qdrant.port }}"
            {{- if .Values.orchestrator.enabled }}
            # Post-RCA completion callback (the orchestrator dispatches remediation).
            - name: ORCHESTRATOR_CALLBACK_URL
              value: "http://{{ $fn }}-orchestrator:{{ .Values.orchestrator.port }}/callbacks/rca"
            {{- end }}
          envFrom:
            {{- include "velai.commonEnvFrom" . | nindent 12 }}
            {{- include "velai.agentConfigEnvFrom" (dict "root" . "agent" "rca") | nindent 12 }}
          readinessProbe:
            httpGet: { path: /, port: {{ .Values.rca.port }} }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources: {{- toYaml .Values.rca.resources | nindent 12 }}
          {{- include "velai.protectMount" (dict "p" .Values.rca.protected) | nindent 10 }}
      {{- include "velai.protectVolume" (dict "p" .Values.rca.protected) | nindent 6 }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-rca-agent
  labels: {{- include "velai.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: rca-agent
  ports:
    - port: {{ .Values.rca.port }}
      targetPort: {{ .Values.rca.port }}
      name: http
{{- end }}
