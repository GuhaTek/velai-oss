{{- if and .Values.adminConsole.enabled .Values.adminConsole.ingress.enabled }}
{{- $fn := include "velai.fullname" . }}
{{- $ing := .Values.adminConsole.ingress }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fn }}-admin-console
  labels: {{- include "velai.labels" . | nindent 4 }}
  {{- with $ing.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with $ing.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $ing.host | quote }}
      http:
        paths:
          {{- /* Orchestrator paths (e.g. /webhook) ride on the console host. They render before
                 "/" because an ALB evaluates one Ingress's paths in order: after the catch-all,
                 the console would answer them. */}}
          {{- if .Values.orchestrator.enabled }}
          {{- range $ing.orchestratorPaths }}
          {{- if or (not (hasPrefix "/" .)) (eq . "/") }}
          {{- fail (printf "adminConsole.ingress.orchestratorPaths: %q must start with \"/\" and must not be \"/\" (that is the console)" .) }}
          {{- end }}
          - path: {{ . | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fn }}-orchestrator
                port:
                  number: {{ $.Values.orchestrator.port }}
          {{- end }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fn }}-admin-console
                port:
                  number: {{ .Values.adminConsole.port }}
{{- end }}
