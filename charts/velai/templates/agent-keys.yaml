{{- /* Keys shared by the licensed agents in this release: RCA_API_KEY (the RCA alert webhook's
       bearer key, also given to the orchestrator + on-call agent that call RCA) and QDRANT_API_KEY
       (Qdrant server + its clients). Preserved on upgrade, generated on first install, independent
       of internalToken.existingSecret. */ -}}
{{- if or (.Values.rca | default dict).enabled (.Values.remediation | default dict).enabled }}
{{- $name := printf "%s-agent-keys" (include "velai.fullname" .) -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) -}}
{{- $data := dict -}}
{{- if $existing -}}{{- $data = $existing.data | default dict -}}{{- end -}}
{{- $out := dict -}}
{{- range $k := list "RCA_API_KEY" "QDRANT_API_KEY" -}}
{{- if hasKey $data $k -}}{{- $_ := set $out $k (index $data $k | b64dec) -}}{{- else -}}{{- $_ := set $out $k (randAlphaNum 48) -}}{{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "velai.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # keep the generated keys across upgrades
type: Opaque
stringData:
  RCA_API_KEY: {{ $out.RCA_API_KEY | quote }}
  QDRANT_API_KEY: {{ $out.QDRANT_API_KEY | quote }}
{{- end }}
